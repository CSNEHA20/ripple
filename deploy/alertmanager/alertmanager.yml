global:
  resolve_timeout: 1m

route:
  receiver: "ripple-webhook"
  group_by: ["alertname", "service"]
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 1m

receivers:
  - name: "ripple-webhook"
    webhook_configs:
      - url: "http://backend:8000/webhooks/alert"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: "ripple_whtok_91a4c8e2b7f3d560"
