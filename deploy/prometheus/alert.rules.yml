groups:
  - name: ripple_demo_alerts
    rules:
      - alert: ServiceHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (service, le)) > 1.0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "High p95 latency on service {{ $labels.service }}"
          description: "Service {{ $labels.service }} is experiencing p95 latency exceeding 1000ms."

      - alert: ServiceHighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) by (service) / sum(rate(http_requests_total[1m])) by (service) > 0.1
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} is failing with error rate > 10%."
