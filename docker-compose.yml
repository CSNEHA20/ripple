services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ripple-falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripple-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/eval:/app/eval
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - ENVIRONMENT=development
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-ripple_alertmanager_token_secret}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ripple-frontend
    ports:
      - "5173:80"
      - "80:80"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ripple-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: ripple-alertmanager
    ports:
      - "9093:9093"
    environment:
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
    volumes:
      - ./deploy/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "sed \"s|\\$${WEBHOOK_TOKEN}|$${WEBHOOK_TOKEN}|g\" /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkor-data:

