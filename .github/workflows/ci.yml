name: Ripple Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.11 & FalkorDB)
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv pip install --system -e "backend[dev]"

      - name: Verify Python compilation
        run: python -m compileall backend/app

      - name: Run Full Pytest Suite (All Tests against FalkorDB)
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
          ENVIRONMENT: test
          AUTH_DEV_MODE: "true"
        run: |
          cd backend
          pytest -v tests/

      - name: Run Multi-Tenant Concurrent Load Test
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
          ENVIRONMENT: test
        run: |
          python scripts/run_load_test.py --tenants load_tenant_alpha,load_tenant_beta --incidents 15 --workers 8

      - name: Run Real-Time End-to-End Test Suite
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
          ENVIRONMENT: test
        run: |
          python scripts/e2e_realtime_test.py --testclient

  frontend-build:
    name: Frontend Typecheck & Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript typecheck & production build
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Production Multi-Stage Docker Images Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ripple-backend:latest

      - name: Build Frontend Multi-Stage Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ripple-frontend:latest
